<html>
  <head>
    <link rel="stylesheet" href="index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Karla:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="https://img.icons8.com/?size=100&id=46813&format=png&color=000000"
      type="image/x-icon"
    />
    <title>Password Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body>
    <main>
      <h1 id="title">
        Generate a
        <br />
        <span>random password</span>
      </h1>
      <p id="promo">Never use an insecure password again.</p>
      <label for="password-length">Password Length:</label>
      <input
        id="password-length"
        type="number"
        min="2"
        max="20"
        placeholder="15"
      />
      <br />
      <input type="checkbox" id="symbols" />
      <label for="symbols">Symbols</label>
      <input type="checkbox" id="numbers" />
      <label for="numbers">Numbers</label>
      <br />
      <button id="gen-pass-btn">Generate passwords</button>
      <hr />
      <div id="passwords">
        <p id="password1"></p>
        <p id="password2"></p>
      </div>
    </main>
    <script src="index.js"></script>
  </body>
</html>
